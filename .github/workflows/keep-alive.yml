name: Réveil Supabase

# Un projet Supabase gratuit est mis en pause après ~7 jours sans activité.
# On tape l'API deux fois par semaine pour qu'il reste chaud.
# Deux fois, pas une : si un run échoue, il reste une chance avant la pause.

on:
  schedule:
    - cron: '17 6 * * 1'   # lundi 06h17 UTC
    - cron: '17 6 * * 4'   # jeudi 06h17 UTC
  workflow_dispatch:        # bouton « Run workflow » pour tester tout de suite

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /rest/v1/scores
        env:
          SUPABASE_URL: https://kisjanhyyceimvwxcear.supabase.co
          SUPABASE_KEY: sb_publishable_rP2MpD8WYGFDPGOjB7Ybmw_MDOz5QC3
        run: |
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/scores?select=id&limit=1")

          echo "HTTP $code"
          cat /tmp/body.txt
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Supabase a répondu $code au lieu de 200."
            exit 1
          fi
          echo "Projet réveillé."
