<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Quiz Famille · buzzer</title>
<meta name="theme-color" content="#02141f">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  body { background:#02141f; color:#e2e8f0; font-family:Inter,sans-serif;
         min-height:100dvh; overscroll-behavior:none; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.09);
          border-radius:1.25rem; backdrop-filter:blur(12px); }
  .kicker { font-size:.68rem; letter-spacing:.26em; text-transform:uppercase; font-weight:800; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
         padding:1rem 1.2rem; border-radius:.8rem; font-weight:700; cursor:pointer;
         transition:all .25s cubic-bezier(.16,1,.3,1); border:1px solid transparent; font-size:1rem; }
  .btn:active:not(:disabled) { transform:scale(.98); }
  .btn:disabled { opacity:.35; }
  .btn-primary { background:#41B6E6; color:#002B49; }
  .btn-ghost { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.14); color:#e2e8f0; }
  .inp { width:100%; padding:.9rem 1rem; border-radius:.8rem; background:rgba(255,255,255,.05);
         border:1px solid rgba(255,255,255,.14); color:#fff; font-size:1.05rem; }
  .inp:focus { outline:none; border-color:#41B6E6; }
  .prop { width:100%; text-align:left; padding:1.1rem 1.2rem; border-radius:.8rem; font-size:1.05rem;
          background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); color:#fff;
          transition:all .25s cubic-bezier(.16,1,.3,1); }
  .prop:active { transform:scale(.99); border-color:#41B6E6; }
  .lettre { display:inline-flex; width:1.9rem; height:1.9rem; border-radius:.5rem; margin-right:.7rem;
            align-items:center; justify-content:center; background:rgba(65,182,230,.16); color:#41B6E6;
            font-weight:800; font-size:.9rem; }
  #gros { width:min(80vw,340px); height:min(80vw,340px); border-radius:9999px;
          font-family:'Playfair Display',serif; font-size:3rem; font-weight:900;
          display:flex; align-items:center; justify-content:center; border:none;
          transition:all .25s cubic-bezier(.16,1,.3,1); }
  .arme { background:#E4002B; color:#fff; box-shadow:0 0 0 8px rgba(228,0,43,.14); }
  .repos { background:rgba(255,255,255,.05); color:#475569; border:1px solid rgba(255,255,255,.1); }
  .vue { display:none; } .vue.on { display:block; }
</style>
</head>
<body>
<div class="max-w-md mx-auto px-5 py-8">

  <!-- ============ rejoindre ============ -->
  <div id="vRejoindre" class="vue on">
    <p class="kicker text-q-blue" style="color:#41B6E6">Quiz Famille</p>
    <h1 class="font-serif text-4xl font-black text-white mt-3">Ton buzzer</h1>
    <p class="text-sm text-slate-400 mt-3">
      Le code s'affiche sur la tablette. Garde cet écran ouvert pendant toute la partie.
    </p>
    <div class="card p-5 mt-6 space-y-3">
      <input id="inCode" class="inp uppercase tracking-[.35em] text-center font-black text-2xl"
             placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters">
      <input id="inNom" class="inp" placeholder="Ton prénom" autocomplete="given-name">
      <button id="bGo" class="btn btn-primary w-full">Rejoindre la partie</button>
    </div>
    <p id="erreur" class="text-sm mt-4 text-center" style="color:#fca5a5"></p>
  </div>

  <!-- ============ en jeu ============ -->
  <div id="vJeu" class="vue text-center">
    <div class="flex items-center justify-between text-xs">
      <span id="jNom" class="font-bold text-white"></span>
      <span id="jEtat" class="text-slate-500"></span>
    </div>

    <div class="my-8 flex justify-center">
      <button id="gros" class="repos" disabled>…</button>
    </div>

    <p id="jInfo" class="text-slate-400 text-sm min-h-[3rem] px-2"></p>
    <p id="jScore" class="font-serif text-3xl font-black text-white mt-4"></p>
    <p id="jHorloge" class="text-[.65rem] text-slate-600 mt-6"></p>
  </div>

  <!-- ============ répondre ============ -->
  <div id="vReponse" class="vue">
    <p class="kicker text-center" style="color:#E4002B">À toi de répondre</p>
    <p id="rChrono" class="font-serif text-5xl font-black text-white text-center my-4">15</p>
    <p class="text-xs text-slate-500 text-center mb-5">L'énoncé est sur la tablette.</p>
    <div id="rZone" class="space-y-3"></div>
  </div>

</div>

<script src="js/transport.js"></script>
<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); };
var T = window.Quiz.Transport;
var canal = null, manche = 0, arme = false, chrono = null, veille = null;

function vue(id) {
  ['vRejoindre', 'vJeu', 'vReponse'].forEach(function (v) {
    $('#' + v).classList.toggle('on', v === id);
  });
}
function vibrer(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

/* L'écran d'un téléphone s'éteint au bout de 30 s. Pendant une partie
   de buzz, c'est rédhibitoire. Wake Lock n'est pas supporté partout et
   ne marche qu'après une interaction : d'où le try/catch silencieux. */
async function garderAllume() {
  try { veille = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !veille) garderAllume();
});

/* code prérempli depuis le QR ou le lien : buzz.html?c=KTRB */
var codeUrl = (location.search.match(/[?&]c=([A-Za-z0-9]{3,6})/) || [])[1];
if (codeUrl) { $('#inCode').value = codeUrl.toUpperCase(); $('#inNom').focus(); }
try {
  var dernier = localStorage.getItem('quiz.buzz.nom');
  if (dernier) $('#inNom').value = dernier;
} catch (e) {}

$('#bGo').onclick = function () {
  var code = $('#inCode').value.trim().toUpperCase();
  var nom  = $('#inNom').value.trim();
  if (code.length < 3) { $('#erreur').textContent = 'Il manque le code de la tablette.'; return; }
  if (!nom) { $('#erreur').textContent = 'Et ton prénom ?'; return; }
  try { localStorage.setItem('quiz.buzz.nom', nom); } catch (e) {}

  this.disabled = true;
  this.textContent = 'Connexion…';
  garderAllume();

  canal = T.creer({
    salon: code, role: 'joueur', nom: nom,
    onEtat: function (e, d) {
      var t = { connexion: 'connexion…', ouvert: 'connecté', ferme: 'déconnecté',
                coupe: 'coupé', erreur: 'erreur', relance: 'reconnexion…' }[e] || e;
      $('#jEtat').textContent = t;
      if (e === 'erreur' || e === 'ferme') {
        $('#erreur').textContent = 'Connexion perdue. Ça se rétablit tout seul en général.';
      }
    }
  });

  canal.sur('bienvenue', function () {
    vue('vJeu');
    $('#jNom').textContent = nom;
    $('#jInfo').textContent = 'Bien arrivé. On cale les horloges…';
    canal.synchroniser(6).then(function (h) {
      $('#jHorloge').textContent = 'horloge calée · aller-retour ' + h.delai + ' ms';
      $('#jInfo').textContent = 'Prêt. Attends la première question.';
      canal.envoyer('horloge', { offset: h.offset, delai: h.delai });
    });
  });

  canal.sur('armer', function (d) {
    manche = d.manche; arme = true;
    vue('vJeu');
    var g = $('#gros');
    g.disabled = false; g.className = 'arme'; g.textContent = 'BUZZ';
    $('#jInfo').textContent = 'La question est sur la tablette.';
    vibrer(25);
  });

  canal.sur('fermer', function () { desarmer('Trop tard.'); });

  canal.sur('verdict', function (d) {
    var moi = (d.classement || []).filter(function (c) { return c.de === canal.id; })[0];
    if (d.gagnant === canal.id) { $('#jInfo').textContent = 'Tu as buzzé le premier.'; vibrer([40, 60, 40]); }
    else if (moi) $('#jInfo').textContent = d.gagnantNom + ' t\'a devancé de ' + moi.ecart + ' ms.';
    else $('#jInfo').textContent = d.gagnantNom + ' a buzzé.';
    desarmer(null);
  });

  canal.sur('repondre', function (d) {
    if (d.manche !== manche) return;
    montrerReponse(d);
  });

  canal.sur('resultat', function (d) {
    stopChrono();
    vue('vJeu');
    desarmer(null);
    var moi = (d.scores || []).filter(function (s) { return s.de === canal.id; })[0];
    if (moi) $('#jScore').textContent = moi.score + ' pts';
    $('#jInfo').innerHTML = d.qui === canal.id
      ? (d.bon ? '<span style="color:#86efac">Bien vu.</span>' : '<span style="color:#fca5a5">Raté. C\'était : ' + d.attendu + '</span>')
      : (d.quiNom ? d.quiNom + (d.bon ? ' a trouvé.' : ' s\'est trompé.') : 'Personne n\'a trouvé.');
  });

  canal.sur('fin', function (d) {
    stopChrono(); vue('vJeu');
    desarmer(null);
    var moi = (d.classement || []).filter(function (s) { return s.de === canal.id; })[0];
    $('#jInfo').innerHTML = moi
      ? '<span class="font-bold text-white">Partie terminée · ' + moi.rang + (moi.rang === 1 ? 'er' : 'e') + ' avec ' + moi.score + ' pts</span>'
      : 'Partie terminée.';
    $('#gros').textContent = '🏁';
  });

  canal.connecter()
    .then(function () { canal.envoyer('hello', {}); })
    .catch(function (e) {
      $('#erreur').textContent = 'Impossible de rejoindre : ' + e.message;
      $('#bGo').disabled = false;
      $('#bGo').textContent = 'Réessayer';
    });
};

function desarmer(txt) {
  arme = false;
  var g = $('#gros');
  g.disabled = true; g.className = 'repos'; g.textContent = '…';
  if (txt) $('#jInfo').textContent = txt;
}

/* pointerdown plutôt que click : on ne paie pas les ~50 ms que le
   navigateur mobile passe à guetter un éventuel double-tap. */
$('#gros').addEventListener('pointerdown', function () {
  if (!arme) return;
  canal.envoyer('buzz', { manche: manche, t: canal.maintenant() });
  vibrer(60);
  desarmer('Buzz envoyé.');
});

/* ---------- écran de réponse ---------- */
function montrerReponse(d) {
  vue('vReponse');
  vibrer([30, 50, 30]);
  var z = $('#rZone');
  z.innerHTML = '';

  var envoyer = function (v) {
    stopChrono();
    canal.envoyer('reponse', { manche: d.manche, valeur: v });
    vue('vJeu');
    $('#jInfo').textContent = 'Réponse envoyée.';
  };

  if (d.type === 'qcm') {
    d.choices.forEach(function (t, i) {
      var b = document.createElement('button');
      b.className = 'prop';
      b.innerHTML = '<span class="lettre">' + 'ABCD'[i] + '</span>' + t;
      b.onclick = function () { envoyer(i); };
      z.appendChild(b);
    });
  } else if (d.type === 'vraifaux') {
    [['Vrai', true], ['Faux', false]].forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'prop text-center font-bold';
      b.textContent = p[0];
      b.onclick = function () { envoyer(p[1]); };
      z.appendChild(b);
    });
  } else {
    var est = d.type === 'estimation';
    z.innerHTML = '<input id="rIn" class="inp" ' +
      (est ? 'type="number" step="any" inputmode="decimal"' : 'type="text" autocomplete="off"') +
      ' placeholder="' + (est ? 'Ton chiffre' + (d.unit ? ' en ' + d.unit : '') : 'Ta réponse') + '">' +
      '<button id="rVal" class="btn btn-primary w-full">Valider</button>';
    $('#rVal').onclick = function () { envoyer($('#rIn').value); };
    $('#rIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') envoyer($('#rIn').value); });
    $('#rIn').focus();
  }

  var reste = d.secondes || 15;
  $('#rChrono').textContent = reste;
  stopChrono();
  chrono = setInterval(function () {
    reste--;
    $('#rChrono').textContent = Math.max(0, reste);
    if (reste <= 0) { stopChrono(); envoyer(null); }
  }, 1000);
}

function stopChrono() { if (chrono) { clearInterval(chrono); chrono = null; } }

})();
</script>
</body>
</html>
